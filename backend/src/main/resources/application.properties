# ── Server ──────────────────────────────────────────────────────────────────
server.port=8080

# ── DataSource (MySQL) ───────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/intensify_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── JWT ──────────────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── AI Multi-Provider Chain & Settings ────────────────────────────────────────
app.ai.provider=${AI_PROVIDER:gemini}
app.ai.provider-chain=${AI_PROVIDER_CHAIN:gemini,cloudflare}

app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.model=${GEMINI_MODEL:gemini-3.6-flash}


app.ai.cloudflare.account-id=${CLOUDFLARE_ACCOUNT_ID:}
app.ai.cloudflare.api-token=${CLOUDFLARE_API_TOKEN:}
app.ai.cloudflare.model=${CLOUDFLARE_MODEL:@cf/meta/llama-3-8b-instruct}


# ── Spring AI (OpenAI) ───────────────────────────────────────────────────────
spring.ai.openai.api-key=${OPENAI_API_KEY:your-api-key-here}
spring.ai.openai.chat.options.model=gpt-4o
spring.ai.openai.chat.options.temperature=0.2

# ── App-level caps ───────────────────────────────────────────────────────────
# Note: explanation and code length caps are enforced via @Size in SessionDtos — not read from config.
app.session.daily-cap=10
app.ai.timeout-seconds=45

# ── CORS (React dev server) ──────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.intensify=INFO
logging.level.org.springframework.security=WARN
